<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Events admin — Creative Hands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..800,100&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bisque:#fbf5ea;--bisque-2:#f3e8d6;--ink:#2a1640;--plum:#3a1a5c;--plum-2:#5b2d8a;--marigold:#f5b83d;--coral:#ee5a6f;--teal:#149c95;--line:rgba(42,22,64,.16);--display:"Fraunces",Georgia,serif;--body:"Figtree",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bisque);color:var(--ink);font:400 16px/1.5 var(--body);padding-bottom:110px}
h1,h2{font-family:var(--display);font-variation-settings:"SOFT" 100;letter-spacing:-.02em;line-height:1.1;margin:0}
h1{font-size:clamp(1.8rem,4vw,2.5rem)}h2{font-size:1.4rem}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{padding:28px 0 22px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
header a{margin-left:auto;font-weight:600;color:var(--plum-2)}
.mode{font:700 .72rem/1 var(--body);letter-spacing:.12em;text-transform:uppercase;padding:8px 12px;border-radius:99px;border:2px solid var(--ink);background:#fff}
.mode.live{background:#c9efd3}.mode.file{background:#ffe7a8}
.cols{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:22px;align-items:start}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.card{background:#fff;border:2px solid var(--ink);border-radius:24px;padding:24px}
label{display:block;font-weight:600;font-size:.9rem;margin:16px 0 6px}
label small{font-weight:400;color:rgba(42,22,64,.7)}
input[type=text],input[type=date],input[type=time],input[type=password],select,textarea{width:100%;font:inherit;color:inherit;padding:11px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bisque)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--plum-2);background:#fff}
textarea{min-height:92px;resize:vertical}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.row>div,form{min-width:0}input{min-width:0;max-width:100%}
@media(max-width:420px){.row{grid-template-columns:minmax(0,1fr)}.card{padding:18px}}
.check{display:flex;align-items:center;gap:10px;margin-top:18px;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--plum)}
.btn{font:700 .95rem/1 var(--body);padding:13px 20px;border-radius:99px;border:2px solid var(--ink);background:var(--ink);color:var(--bisque);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.sm{padding:9px 14px;font-size:.85rem}
.btn.danger{background:var(--coral);border-color:var(--ink);color:#fff}
.btn.sun{background:var(--marigold);color:var(--ink)}
.btn:focus-visible,a:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.err{color:#b3261e;font-weight:600;font-size:.9rem;margin:12px 0 0;min-height:1.2em}
ul{list-style:none;margin:16px 0 0;padding:0}
li{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px dashed var(--line)}
li>div{min-width:0;flex:1}
li .t{font-weight:700}
li .w{font-size:.88rem;color:rgba(42,22,64,.75)}
li .tag{display:inline-block;font:700 .66rem/1 var(--body);letter-spacing:.1em;text-transform:uppercase;background:var(--bisque-2);border-radius:99px;padding:5px 8px;margin-left:6px;vertical-align:middle}
li.past{opacity:.55}
li .b{display:flex;gap:6px;flex:none}
.empty{color:rgba(42,22,64,.7);margin:16px 0 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--plum);color:var(--bisque);padding:14px 0;border-top:2px solid var(--ink)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.bar p{margin:0;flex:1;min-width:200px;font-weight:500}
.bar input{width:210px;background:#fff}
.bar[hidden]{display:none}
.who{font-size:.9rem;color:rgba(42,22,64,.75)}
.who b{color:var(--ink)}
header .links{margin-left:auto;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header .links a{margin-left:0}
.history{margin-top:22px}
.history li .w b{font-weight:600;color:var(--ink)}
.history .now{display:inline-block;font:700 .66rem/1 var(--body);letter-spacing:.1em;text-transform:uppercase;background:#c9efd3;border-radius:99px;padding:5px 8px;margin-left:6px;vertical-align:middle}
.notice{margin:0 0 18px;padding:14px 18px;border-radius:16px;border:2px solid var(--ink);background:#ffe7a8;font-weight:500}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Events admin</h1>
    <span class="mode" id="mode">Loading…</span>
    <span class="links">
      <span class="who" id="who" hidden>Signed in as <b id="whoEmail"></b></span>
      <a href="/#events">View the calendar →</a>
      <a href="/cdn-cgi/access/logout" id="signout" hidden>Sign out</a>
    </span>
  </header>

  <p class="notice" id="notice" role="alert" hidden></p>

  <div class="cols" id="editor" hidden>
    <form class="card" id="form" novalidate>
      <h2 id="formTitle">Add an event</h2>
      <label for="title">Title</label>
      <input type="text" id="title" maxlength="120" autocomplete="off">
      <div class="row">
        <div><label for="date">Date</label><input type="date" id="date"></div>
        <div><label for="until">Repeat until <small>(optional)</small></label><input type="date" id="until" disabled></div>
      </div>
      <div class="row">
        <div><label for="start">Starts <small>(blank = all day)</small></label><input type="time" id="start"></div>
        <div><label for="end">Ends</label><input type="time" id="end"></div>
      </div>
      <label for="repeat">Repeats</label>
      <select id="repeat"><option value="none">Doesn’t repeat</option></select>
      <label for="desc">Description <small>(optional)</small></label>
      <textarea id="desc" maxlength="600"></textarea>
      <p class="err" id="err" role="alert"></p>
      <div class="actions">
        <button class="btn" type="submit" id="save">Add event</button>
        <button class="btn ghost" type="button" id="cancel" hidden>Cancel</button>
      </div>
    </form>

    <div>
      <div class="card">
        <h2>Events <span id="count"></span></h2>
        <p class="empty" id="empty" hidden>No events yet. Add the first one with the form.</p>
        <ul id="list"></ul>
      </div>

      <div class="card history" id="historyCard" hidden>
        <h2>Change history</h2>
        <p class="empty" id="historyEmpty">Nothing published yet. Each time you publish, the list is saved here so you can go back to it.</p>
        <ul id="historyList"></ul>
      </div>
    </div>
  </div>
</div>

<div class="bar" id="bar" hidden>
  <div class="wrap">
    <p id="barMsg" role="status"></p>
    <button class="btn sun" type="button" id="publish">Publish changes</button>
    <button class="btn ghost" type="button" id="download" style="color:var(--bisque);border-color:var(--bisque)">Download events.json</button>
  </div>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var el=function(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
  // live = the admin API answered (signed in through Cloudflare Access); otherwise "file mode" (local preview)
  var S={events:[],live:false,version:null,dirty:false,editing:null,busy:false};
  var today=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Chicago'}).format(new Date());

  function t12(t){var p=t.split(':'),h=+p[0];return(h%12||12)+(p[1]!=='00'?':'+p[1]:'')+(h<12?' AM':' PM')}
  function when(ev){return ev.start?t12(ev.start)+(ev.end?' – '+t12(ev.end):''):'All day'}
  function dstr(s){var p=s.split('-');return new Date(Date.UTC(+p[0],p[1]-1,+p[2])).toLocaleDateString('en-US',{timeZone:'UTC',weekday:'short',month:'short',day:'numeric',year:'numeric'})}
  function stamp(iso){return new Date(iso).toLocaleString('en-US',{timeZone:'America/Chicago',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})}
  var WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],ORD=['1st','2nd','3rd','4th'];
  function repeats(ev){return ev.repeat&&ev.repeat!=='none'}
  function isOver(ev){return repeats(ev)?(ev.until&&ev.until<today):ev.date<today}
  // The repeat choices that make sense for a first date, as [value, label] pairs.
  function choices(date){
    var c=[['none','Doesn’t repeat']];if(!date)return c;
    var p=date.split('-'),y=+p[0],m=+p[1],d=+p[2],w=WD[new Date(Date.UTC(y,m-1,d)).getUTCDay()],len=new Date(Date.UTC(y,m,0)).getUTCDate();
    c.push(['weekly','Every week on '+w]);
    if(d<=28)c.push(['monthly-nth','Monthly on the '+ORD[Math.ceil(d/7)-1]+' '+w]);
    if(d>len-7)c.push(['monthly-last','Monthly on the last '+w]);
    c.push(['monthly-date','Monthly on day '+d+(d>28?' (skips shorter months)':'')]);
    return c;
  }
  function repeatLabel(ev){var c=choices(ev.date).filter(function(o){return o[0]===ev.repeat})[0];return c?c[1]:''}
  // Rebuild the dropdown for the chosen date, keeping the choice when it still fits
  // (a "by weekday" choice switches between "3rd Saturday" and "last Saturday" as needed).
  function fillRepeat(want){
    var sel=$('repeat'),c=choices($('date').value),vals=c.map(function(o){return o[0]});
    if(vals.indexOf(want)<0)want=/^monthly-(nth|last)$/.test(want)?(vals.indexOf('monthly-nth')>=0?'monthly-nth':vals.indexOf('monthly-last')>=0?'monthly-last':'none'):'none';
    sel.textContent='';
    c.forEach(function(o){var op=el('option',null,o[1]);op.value=o[0];sel.appendChild(op)});
    sel.value=want;sel.disabled=c.length<2;
    $('until').disabled=want==='none';if(want==='none')$('until').value='';
  }
  function notice(msg){$('notice').textContent=msg||'';$('notice').hidden=!msg}

  // Talk to the admin API. If Cloudflare Access sign-in has expired, the request is redirected
  // to the sign-in page, which a script can't follow - we report that as "signed out".
  function api(method,path,body){
    var o={method:method,credentials:'same-origin',redirect:'manual',headers:{accept:'application/json'}};
    if(body!==undefined){o.headers['content-type']='application/json';o.body=JSON.stringify(body)}
    return fetch('/admin/api/'+path,o).then(function(r){
      if(r.type==='opaqueredirect'||r.status===401)return{status:401,ok:false,j:{error:'Your sign-in has expired.'}};
      return r.json().catch(function(){return{}}).then(function(j){return{status:r.status,ok:r.ok,j:j}});
    });
  }
  function signedOut(){
    notice('Your sign-in has expired. Use “Download events.json” to keep a copy of unpublished changes, then reload the page to sign in again.');
    $('download').hidden=false;$('bar').hidden=!S.dirty;
  }

  function render(){
    var list=$('list');list.textContent='';
    S.events.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0}).forEach(function(ev){
      var li=el('li',isOver(ev)?'past':''),d=el('div'),t=el('div','t',ev.title),b=el('div','b');
      if(repeats(ev))t.appendChild(el('span','tag',ev.repeat==='weekly'?'Weekly':'Monthly'));
      if(isOver(ev))t.appendChild(el('span','tag','Past'));
      d.appendChild(t);
      d.appendChild(el('div','w',(repeats(ev)?repeatLabel(ev)+' · from ':'')+dstr(ev.date)+(repeats(ev)&&ev.until?' until '+dstr(ev.until):'')+' · '+when(ev)));
      var e=el('button','btn ghost sm','Edit');e.type='button';e.addEventListener('click',function(){edit(ev.id)});
      var x=el('button','btn ghost sm','Delete');x.type='button';
      armed(x,'Confirm delete',function(){S.events=S.events.filter(function(o){return o.id!==ev.id});if(S.editing===ev.id)reset();changed()});
      b.appendChild(e);b.appendChild(x);li.appendChild(d);li.appendChild(b);list.appendChild(li);
    });
    $('count').textContent='('+S.events.length+')';
    $('empty').hidden=S.events.length>0;
    $('bar').hidden=!S.dirty;
    $('publish').hidden=!(S.live&&S.dirty);$('download').hidden=S.live;
    if(S.dirty)$('barMsg').textContent=S.live?'You have unpublished changes.':'You have unsaved changes. Download the file, replace events.json in the site folder, and redeploy.';
  }
  // Two-step button: first click arms it, second click within 4 seconds acts. No browser dialogs.
  function armed(btn,label,act){
    var orig=btn.textContent,cls=btn.className;
    btn.addEventListener('click',function(){
      if(btn.dataset.armed){act();return}
      btn.dataset.armed='1';btn.textContent=typeof label==='function'?label():label;btn.className='btn danger sm';
      setTimeout(function(){delete btn.dataset.armed;btn.textContent=orig;btn.className=cls},4000);
    });
  }
  function changed(){S.dirty=true;render()}
  function reset(){
    S.editing=null;$('form').reset();fillRepeat('none');$('err').textContent='';
    $('formTitle').textContent='Add an event';$('save').textContent='Add event';$('cancel').hidden=true;
  }
  function edit(id){
    var ev=S.events.filter(function(o){return o.id===id})[0];if(!ev)return;
    S.editing=id;$('title').value=ev.title;$('date').value=ev.date;$('start').value=ev.start||'';$('end').value=ev.end||'';
    fillRepeat(ev.repeat||'none');$('until').value=repeats(ev)?ev.until||'':'';$('desc').value=ev.desc||'';
    $('formTitle').textContent='Edit event';$('save').textContent='Save changes';$('cancel').hidden=false;$('err').textContent='';
    $('title').focus();
  }
  $('date').addEventListener('change',function(){fillRepeat($('repeat').value)});
  $('repeat').addEventListener('change',function(){fillRepeat(this.value)});
  $('cancel').addEventListener('click',reset);
  $('form').addEventListener('submit',function(e){
    e.preventDefault();
    var ev={title:$('title').value.trim(),date:$('date').value,start:$('start').value,end:$('end').value,
            repeat:$('repeat').value,until:$('repeat').value!=='none'?$('until').value:'',desc:$('desc').value.trim()};
    var msg=!ev.title?'Give the event a title.':!ev.date?'Pick a date.':(ev.end&&!ev.start)?'Add a start time, or clear the end time.':
            (ev.start&&ev.end&&ev.end<=ev.start)?'The end time must be after the start time.':(ev.until&&ev.until<ev.date)?'“Repeat until” must be on or after the first date.':'';
    $('err').textContent=msg;if(msg)return;
    if(S.editing){ev.id=S.editing;S.events=S.events.map(function(o){return o.id===ev.id?ev:o})}
    else{ev.id=(ev.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'event')+'-'+Date.now().toString(36);S.events.push(ev)}
    reset();changed();
  });

  $('download').addEventListener('click',function(){
    var a=el('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S.events,null,2)+'\n'],{type:'application/json'}));
    a.download='events.json';document.body.appendChild(a);a.click();a.remove();
  });

  $('publish').addEventListener('click',function(){
    if(S.busy)return;S.busy=true;
    $('publish').disabled=true;$('barMsg').textContent='Publishing…';
    api('PUT','events',{events:S.events,baseVersion:S.version})
      .then(function(r){
        if(r.status===401)return signedOut();
        if(!r.ok)throw new Error(r.j.error||'Something went wrong.');
        S.dirty=false;S.version=r.j.version;render();
        $('bar').hidden=false;$('barMsg').textContent='Published. The site now shows '+r.j.count+' event'+(r.j.count===1?'':'s')+'.';
        loadHistory();
      })
      .catch(function(e){$('barMsg').textContent='Not published: '+(e.message||'could not reach the site.')})
      .then(function(){$('publish').disabled=false;S.busy=false});
  });
  window.addEventListener('beforeunload',function(e){if(S.dirty){e.preventDefault();e.returnValue=''}});

  function loadHistory(){
    return api('GET','history').then(function(r){
      if(!r.ok)return;
      var ul=$('historyList');ul.textContent='';
      var v=r.j.versions||[];$('historyEmpty').hidden=v.length>0;
      v.forEach(function(h,i){
        var li=el('li'),d=el('div'),t=el('div','t',i===0?'Current list':stamp(h.at));
        if(i===0)t.appendChild(el('span','now','Live'));
        d.appendChild(t);
        var w=el('div','w');
        if(i===0)w.appendChild(document.createTextNode(stamp(h.at)+' · '));
        w.appendChild(document.createTextNode((h.note||'Published')+' · '+h.count+' event'+(h.count===1?'':'s')));
        if(h.by){w.appendChild(document.createTextNode(' · by '));w.appendChild(el('b',null,h.by))}
        d.appendChild(w);li.appendChild(d);
        if(i>0){
          var b=el('div','b'),x=el('button','btn ghost sm','Restore');x.type='button';
          armed(x,function(){return S.dirty?'Discard edits & restore':'Confirm restore'},function(){restore(h.id)});
          b.appendChild(x);li.appendChild(b);
        }
        ul.appendChild(li);
      });
    });
  }
  function restore(id){
    if(S.busy)return;S.busy=true;notice('');
    api('POST','restore',{id:id,baseVersion:S.version})
      .then(function(r){
        if(r.status===401)return signedOut();
        if(!r.ok)throw new Error(r.j.error||'Something went wrong.');
        return load().then(function(){$('bar').hidden=false;$('barMsg').textContent='Restored. The site now shows '+r.j.count+' event'+(r.j.count===1?'':'s')+'.'});
      })
      .catch(function(e){notice('Not restored: '+(e.message||'could not reach the site.'))})
      .then(function(){S.busy=false});
  }

  function load(){
    return api('GET','events').then(function(r){
      if(r.status===401){notice('You are not signed in. Reload the page to sign in.');return}
      if(!r.ok)throw 0;
      S.live=true;S.events=Array.isArray(r.j.events)?r.j.events:[];S.version=r.j.version;S.dirty=false;reset();
      $('whoEmail').textContent=r.j.user||'';$('who').hidden=!r.j.user;$('signout').hidden=false;
      $('mode').textContent='Live — publishes to the site';$('mode').className='mode live';
      $('historyCard').hidden=false;$('editor').hidden=false;render();
      return loadHistory();
    });
  }

  load().catch(function(){
    // No admin API (e.g. a plain local preview): edit a copy of events.json and download it.
    return fetch('/events.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():[]}).catch(function(){return[]}).then(function(list){
      S.live=false;S.events=Array.isArray(list)?list:[];
      $('mode').textContent='File mode — download to save';$('mode').className='mode file';
      $('editor').hidden=false;render();
    });
  });
})();
</script>
</body>
</html>
